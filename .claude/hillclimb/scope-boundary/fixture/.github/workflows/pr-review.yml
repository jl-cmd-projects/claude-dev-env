name: pr-review
on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: [self-hosted, desktop]
    steps:
      - uses: actions/checkout@v4
      - id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.REVIEW_APP_ID }}
          private-key: ${{ secrets.REVIEW_APP_KEY }}
      - name: Open check run
        run: scripts/check_run.sh open "${{ github.event.pull_request.head.sha }}"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
      - name: Start reviewer
        run: scripts/start_review.sh "${{ github.event.pull_request.number }}"
        env:
          REVIEW_MODEL: ${{ vars.REVIEW_MODEL }}
          REVIEW_EFFORT: ${{ vars.REVIEW_EFFORT }}
      - name: Complete check run
        if: always()
        run: scripts/check_run.sh complete "${{ github.event.pull_request.head.sha }}" "${{ job.status }}"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
