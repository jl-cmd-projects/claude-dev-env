name: Instruction budget

on:
  workflow_call:
    inputs:
      validator-repository:
        description: Repository that holds the shared instruction budget checker.
        required: false
        type: string
        default: jl-cmd-projects/claude-dev-env
      validator-ref:
        description: Commit of the validator repository that holds the checker. On pull_request_target the caller passes the base commit, so a pull request cannot edit the checker that gates it.
        required: true
        type: string
      checkout-ref:
        description: Git ref of the repository under check.
        required: true
        type: string
      base-sha:
        description: Base commit for the changed-file scope. Empty checks every instruction file.
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  instruction-budget:
    name: instruction-budget
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.checkout-ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Load shared instruction budget checker
        uses: actions/checkout@v5
        with:
          repository: ${{ inputs.validator-repository }}
          ref: ${{ inputs.validator-ref }}
          path: .instruction-budget-validator
          sparse-checkout: |
            packages/claude-dev-env/scripts/instruction_budget.py
            packages/claude-dev-env/scripts/instruction_budget_files.py
            packages/claude-dev-env/scripts/instruction_budget_links.py
            packages/claude-dev-env/scripts/instruction_budget_names.py
            packages/claude-dev-env/scripts/dev_env_scripts_constants/__init__.py
            packages/claude-dev-env/scripts/dev_env_scripts_constants/followup_constants.py
            packages/claude-dev-env/scripts/dev_env_scripts_constants/private_term_constants.py
            packages/claude-dev-env/scripts/dev_env_scripts_constants/instruction_budget_constants.py
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Check the launch budget, named people, and link nesting
        env:
          BASE_SHA: ${{ inputs.base-sha }}
        run: |
          set -euo pipefail
          checker=.instruction-budget-validator/packages/claude-dev-env/scripts/instruction_budget.py
          scope_arguments=(--all-files)
          if [[ -n "${BASE_SHA}" && ! "${BASE_SHA}" =~ ^0+$ ]]; then
            scope_arguments=()
            changed_files_list="${RUNNER_TEMP}/changed-files.txt"
            if git diff --name-only -z --diff-filter=d "${BASE_SHA}...HEAD" > "${changed_files_list}"; then
              while IFS= read -r -d '' changed_file; do
                scope_arguments+=("--changed-file=${changed_file}")
              done < "${changed_files_list}"
            else
              scope_arguments=(--all-files)
            fi
          fi
          python3 "${checker}" --repository-root . "${scope_arguments[@]}"
