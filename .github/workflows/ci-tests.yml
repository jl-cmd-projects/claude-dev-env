# Deselect policy (single-source lists under .github/ci/):
#   - LivePostAudit: permanently deselected (local register; no credential wiring;
#     gh binary is present on runners but author-swap tokens are not).
#   - Windows-semantics: deselected on ubuntu; run on windows-latest micro-job (#24)
#     from the same windows-semantics-node-ids.txt file.
#   - Author-swap restore: permanently deselected (issue #21 protocol; no gh auth
#     switch credentials on CI runners).
#   - Issue #21 listed hooks/blocking/test_gh_artifact_upload.py; amended to the
#     real path packages/claude-dev-env/scripts/tests/test_gh_artifact_upload.py.
#
# basetemp lives under RUNNER_TEMP (not OS temp root, not inside the repo) so
# is_ephemeral_script_path Linux exemptions do not treat pytest temp paths as
# ephemeral production scripts.
#
# permissions: contents read + pull-requests read (dorny/paths-filter on PRs).

name: CI — Full test suites

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect path changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      package_suite: ${{ steps.filter.outputs.package_suite }}
      root_suite: ${{ steps.filter.outputs.root_suite }}
      javascript: ${{ steps.filter.outputs.javascript }}
      subagent_models: ${{ steps.filter.outputs.subagent_models }}
    steps:
      - uses: actions/checkout@v5

      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        if: github.event_name != 'merge_group'
        with:
          filters: |
            package_suite:
              - '**/*.py'
              - 'pytest.ini'
              - 'pyproject.toml'
              - 'packages/claude-dev-env/**'
              - 'tests/**'
              - '.github/workflows/ci-tests.yml'
              - '.github/ci/**'
            root_suite:
              - '**/*.py'
              - 'pytest.ini'
              - 'pyproject.toml'
              - 'packages/claude-dev-env/**'
              - 'tests/**'
              - '.github/workflows/ci-tests.yml'
              - '.github/ci/**'
              - 'docs/**'
              - '.github/workflows/**'
              - '.github/labels.yml'
              - '.cursor/BUGBOT.md'
            javascript:
              - 'packages/claude-dev-env/**'
              - 'package.json'
              - '.github/workflows/ci-tests.yml'
            subagent_models:
              - 'packages/subagent-models/**'
              - '.github/workflows/ci-tests.yml'

  python:
    name: Python suite (ubuntu)
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.package_suite == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up oxipng
        uses: ./.github/actions/setup-oxipng

      - name: Install Python test dependencies
        run: |
          pip install -e packages/claude-dev-env/ \
            -r packages/claude-dev-env/scripts/pr_verification/requirements.txt \
            pytest \
            pytest-xdist \
            pyyaml \
            psycopg \
            Pillow \
            mypy \
            ruff

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install the Claude Code CLI for plugin tests
        run: npm install --global @anthropic-ai/claude-code@2.1.288

      - name: Configure git identity for test repos
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"

      - name: Prepare pytest basetemp under RUNNER_TEMP
        run: |
          mkdir -p "$RUNNER_TEMP/pytest-basetemp-pkg"

      - name: Package suite
        env:
          GITHUB_STEP_SUMMARY: ${{ runner.temp }}/pytest-step-summary-pkg.md
        run: |
          set -euo pipefail
          source .github/ci/build-deselect-args.sh
          python -m pytest packages/claude-dev-env \
            --basetemp="$RUNNER_TEMP/pytest-basetemp-pkg" \
            -q \
            -n auto \
            "${deselect_args[@]}"

  python-root:
    name: Root suite (ubuntu)
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.root_suite == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python test dependencies
        run: |
          pip install -e packages/claude-dev-env/ \
            pytest \
            pytest-xdist \
            pyyaml \
            psycopg \
            Pillow \
            mypy \
            ruff

      - name: Configure git identity for test repos
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"

      - name: Prepare pytest basetemp under RUNNER_TEMP
        run: |
          mkdir -p "$RUNNER_TEMP/pytest-basetemp-root"

      # Collect-count floor (mirrors the collect-count pattern a consuming
      # repository uses in its own standalone package workflow):
      # renaming or moving a root-suite test file outside python_files =
      # test_*.py collects zero from that path while the rest of tests/ still
      # passes, so the step would otherwise exit 0 looking identical to
      # success. Raise ROOT_SUITE_COLLECT_FLOOR whenever new tests land.
      - name: Enforce the root suite collect-count floor
        env:
          ROOT_SUITE_COLLECT_FLOOR: "158"
        run: |
          set -euo pipefail
          source .github/ci/build-deselect-args.sh
          python -m pytest tests/ .github/ci --collect-only -q "${deselect_args[@]}" | tee collect-only.txt
          COLLECT_LINE=$(grep -E '[0-9]+ tests? collected' collect-only.txt | tail -1 || true)
          COLLECTED_COUNT=$(echo "${COLLECT_LINE}" | grep -oE '^[0-9]+' || true)
          case "${ROOT_SUITE_COLLECT_FLOOR}" in
            ''|*[!0-9]*)
              echo "Collect floor is unreadable ('${ROOT_SUITE_COLLECT_FLOOR}') — refusing to pass the floor check" >&2
              exit 1
              ;;
          esac
          case "${COLLECTED_COUNT}" in
            ''|*[!0-9]*)
              echo "Collected count is unreadable ('${COLLECTED_COUNT}') — refusing to pass the floor check" >&2
              exit 1
              ;;
          esac
          if [ "${COLLECTED_COUNT}" -lt "${ROOT_SUITE_COLLECT_FLOOR}" ]; then
            echo "Collected count ${COLLECTED_COUNT} is BELOW the floor ${ROOT_SUITE_COLLECT_FLOOR} — tests went missing" >&2
            exit 1
          fi
          echo "Root suite collected ${COLLECTED_COUNT} tests, floor is ${ROOT_SUITE_COLLECT_FLOOR}"

      - name: Root suite (tests/, .github/ci/)
        env:
          GITHUB_STEP_SUMMARY: ${{ runner.temp }}/pytest-step-summary-root.md
        run: |
          set -euo pipefail
          source .github/ci/build-deselect-args.sh
          python -m pytest tests/ .github/ci \
            --basetemp="$RUNNER_TEMP/pytest-basetemp-root" \
            -q \
            -n auto \
            "${deselect_args[@]}"

  javascript:
    name: JS suite (ubuntu)
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.javascript == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      # No npm cache: package has no lockfile (issue #22).
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install and run JS tests
        working-directory: packages/claude-dev-env
        run: |
          npm install
          npm test

  subagent-models:
    name: subagent-models mod (ubuntu)
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.subagent_models == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Validate and test the mod
        working-directory: packages/subagent-models
        run: |
          npm install --global @anthropic-ai/claude-code@2.1.288
          claude plugin validate .
          claude plugin test .

  install-playtest:
    name: Install playtest (ubuntu)
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.javascript == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python for the installed hooks
        run: pip install -e packages/claude-dev-env/

      - name: Install the package into a scratch home and start its hooks
        working-directory: packages/claude-dev-env
        run: |
          npm install
          node scripts/ci/install-playtest.mjs --evidence "$RUNNER_TEMP/install-playtest"

      - name: Upload install playtest evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: install-playtest-evidence
          path: ${{ runner.temp }}/install-playtest/**
          if-no-files-found: ignore

  quality-gate:
    name: Quality gate (check.ps1)
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.package_suite == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install quality-gate dependencies
        run: |
          pip install -e packages/claude-dev-env/ \
            ruff \
            mypy

      - name: "Run check.ps1 -SkipTests -SkipRepositoryPolicy"
        shell: pwsh
        run: |
          $checkOutputLines = & pwsh -File packages/claude-dev-env/scripts/check.ps1 -SkipTests -SkipRepositoryPolicy 2>&1
          $checkExitCode = $LASTEXITCODE
          $checkOutputLines | ForEach-Object { Write-Host $_ }
          $checkOutputText = ($checkOutputLines | Out-String)
          if ($checkExitCode -ne 0) {
            throw "check.ps1 exited $checkExitCode"
          }
          if ($checkOutputText -notmatch 'CHECK: OK') {
            throw "check.ps1 output missing CHECK: OK"
          }

  committed-tree:
    name: Check the committed tree from the event merge base
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install committed-tree checker dependencies
        run: pip install -e packages/claude-dev-env/

      - name: Resolve the event merge base
        id: event-merge-base
        env:
          EVENT_BASE_REVISION: ${{ github.event.before || github.event.merge_group.base_sha }}
        run: |
          set -euo pipefail
          event_base_revision="${EVENT_BASE_REVISION}"
          zero_revision="0000000000000000000000000000000000000000"
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ] || [ -z "${event_base_revision}" ] || [ "${event_base_revision}" = "${zero_revision}" ]; then
            event_base_revision="$(git rev-parse HEAD^1)"
          fi
          echo "comparison_revision=$(git merge-base HEAD "${event_base_revision}")" >> "${GITHUB_OUTPUT}"

      - name: Lint changes from the event merge base
        env:
          COMPARISON_REVISION: ${{ steps.event-merge-base.outputs.comparison_revision }}
        run: python packages/claude-dev-env/scripts/cde_lint.py --base "${COMPARISON_REVISION}"

      - name: Scan added lines for personal data with gitleaks
        env:
          COMPARISON_REVISION: ${{ steps.event-merge-base.outputs.comparison_revision }}
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          archive_name="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "${RUNNER_TEMP}/${archive_name}" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive_name}"
          echo "${GITLEAKS_SHA256}  ${RUNNER_TEMP}/${archive_name}" | sha256sum --check --strict
          tar -xzf "${RUNNER_TEMP}/${archive_name}" -C "${RUNNER_TEMP}" gitleaks
          "${RUNNER_TEMP}/gitleaks" git --config .gitleaks.toml --no-banner --redact=50 --verbose --log-opts="${COMPARISON_REVISION}..HEAD" .

      - name: Check repository policy
        run: python packages/claude-dev-env/scripts/repository_policy.py

  windows-semantics:
    name: Windows-semantics micro-suite
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.package_suite == 'true'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python test dependencies
        run: pip install -e packages/claude-dev-env/ pytest

      - name: Run windows-semantics node IDs
        shell: pwsh
        run: |
          $windowsSemanticsListPath = '.github/ci/windows-semantics-node-ids.txt'
          $allSelectedNodeIds = [System.Collections.Generic.List[string]]::new()
          foreach ($eachRawLine in Get-Content -LiteralPath $windowsSemanticsListPath) {
            $eachNodeId = $eachRawLine -replace "`r", ''
            if ([string]::IsNullOrWhiteSpace($eachNodeId)) { continue }
            if ($eachNodeId.StartsWith('#')) { continue }
            $allSelectedNodeIds.Add($eachNodeId)
          }
          $selectedCount = $allSelectedNodeIds.Count
          if ($selectedCount -eq 0) {
            throw "$windowsSemanticsListPath lists no node IDs"
          }
          Write-Host "selected count=$selectedCount"
          & python -m pytest @($allSelectedNodeIds.ToArray()) -q
          if ($LASTEXITCODE -ne 0) {
            throw "windows-semantics pytest exited $LASTEXITCODE"
          }

  # P-21 / H: Node installer lifecycle on a clean Windows runner with isolated
  # HOME, USERPROFILE, and GIT_CONFIG_GLOBAL (the driver sandbox owns those).
  windows-installer-lifecycle:
    name: Windows installer lifecycle
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.javascript == 'true'
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python for installer hooks
        run: pip install -e packages/claude-dev-env/

      - name: Install package JS dependencies
        working-directory: packages/claude-dev-env
        run: npm install

      - name: Run isolated Windows installer lifecycle
        shell: pwsh
        working-directory: packages/claude-dev-env
        run: |
          $evidenceRoot = Join-Path $env:RUNNER_TEMP 'windows-installer-lifecycle'
          $adapter = Join-Path $PWD 'scripts/ci/windows-installer-lifecycle.ps1'
          & $adapter -EvidenceRoot $evidenceRoot

      - name: Run package npm test on Windows
        working-directory: packages/claude-dev-env
        run: npm test

      - name: Upload Windows lifecycle failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-lifecycle-evidence
          path: ${{ runner.temp }}/windows-installer-lifecycle/**
          if-no-files-found: ignore
          retention-days: 7
