name: Open a pull request as the App

run-name: "Open a pull request from ${{ inputs.head }}"

on:
  workflow_dispatch:
    inputs:
      head:
        description: The branch the pull request comes from
        required: true
        type: string
      base:
        description: The branch the pull request merges into
        required: false
        default: main
        type: string
      title:
        description: The pull request title
        required: true
        type: string
      body:
        description: The pull request body, starting with the attribution block
        required: true
        type: string
      draft:
        description: Open the pull request as a draft
        required: false
        default: false
        type: boolean
      reviewer:
        description: The login to assign and request review from, or empty
        required: false
        default: ""
        type: string
      dry_run:
        description: Prove the App token reads the repository and lists pull requests on the head, opening nothing
        required: false
        default: false
        type: boolean

  push:
    branches:
      - claude/project-thread-tcwbig

permissions: {}

concurrency:
  group: open-pr-as-app-${{ inputs.head }}
  cancel-in-progress: false

jobs:
  open:
    name: Open the pull request as the App
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Mint the App token
        id: app_token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: read
          permission-pull-requests: write

      - name: Prove the token reads the repository and lists pull requests on the head
        if: ${{ inputs.dry_run }}
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          PR_HEAD: ${{ inputs.head }}
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO" --jq '"The token reads " + .full_name'
          gh pr list --repo "$GH_REPO" --head "$PR_HEAD" --state all --json number --jq 'length | "Pull requests on the head: \(.)"'

      - name: Open the pull request
        id: open
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          PR_HEAD: ${{ inputs.head }}
          PR_BASE: ${{ inputs.base }}
          PR_TITLE: ${{ inputs.title }}
          PR_BODY: ${{ inputs.body }}
          PR_DRAFT: ${{ inputs.draft }}
        run: |
          set -euo pipefail
          url=$(gh pr list --repo "$GH_REPO" --head "$PR_HEAD" --base "$PR_BASE" --state open --json url --jq '.[0].url // empty')
          if [ -z "$url" ]; then
            printf '%s' "$PR_BODY" > "$RUNNER_TEMP/pr-body.md"
            draft_flag=()
            if [ "$PR_DRAFT" = "true" ]; then
              draft_flag=(--draft)
            fi
            url=$(gh pr create --repo "$GH_REPO" --head "$PR_HEAD" --base "$PR_BASE" \
              --title "$PR_TITLE" --body-file "$RUNNER_TEMP/pr-body.md" "${draft_flag[@]}" | tail -n 1)
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Pull request: $url" >> "$GITHUB_STEP_SUMMARY"
          echo "Pull request: $url"

      - name: Assign and request review from the requester
        if: ${{ !inputs.dry_run && inputs.reviewer != '' }}
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          PR_URL: ${{ steps.open.outputs.url }}
          PR_REVIEWER: ${{ inputs.reviewer }}
        run: |
          gh pr edit "$PR_URL" --add-assignee "$PR_REVIEWER" --add-reviewer "$PR_REVIEWER" \
            || echo "::warning::Could not assign or request review from $PR_REVIEWER"

  bootstrap-dry-run:
    name: Prove the App token on the opener branch
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Mint the App token
        id: app_token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: read
          permission-pull-requests: write

      - name: Prove the token reads the repository and lists pull requests on the head
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          PR_HEAD: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO" --jq '"The token reads " + .full_name'
          gh pr list --repo "$GH_REPO" --head "$PR_HEAD" --state all --json number --jq 'length | "Pull requests on the head: \(.)"'
