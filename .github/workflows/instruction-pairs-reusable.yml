name: Validate instruction pairs

on:
  workflow_call:
    inputs:
      validator-ref:
        description: Commit containing the shared instruction validator.
        required: true
        type: string
      checkout-ref:
        description: Git ref to check out as the tree under validation.
        required: true
        type: string
      skip-validation:
        description: Succeed without validating the tree for release-please pull requests.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  instruction-pairs:
    name: instruction-pairs
    runs-on: ubuntu-latest
    steps:
      - name: Skip validation for release-please pull requests
        if: ${{ inputs.skip-validation }}
        run: echo "Skipping instruction-pairs tree validation for a release-please pull request."

      - name: Checkout repository
        if: ${{ !inputs.skip-validation }}
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.checkout-ref }}
          persist-credentials: false

      - name: Load shared instruction validator
        if: ${{ !inputs.skip-validation }}
        uses: actions/checkout@v5
        with:
          repository: ${{ github.repository }}
          ref: ${{ inputs.validator-ref }}
          path: .instruction-pair-validator
          sparse-checkout: |
            packages/claude-dev-env/scripts/validate_instruction_pairs.py
            packages/claude-dev-env/scripts/subprocess_window_access.py
            packages/claude-dev-env/scripts/dev_env_scripts_constants/__init__.py
            packages/claude-dev-env/scripts/dev_env_scripts_constants/followup_constants.py
            packages/claude-dev-env/hooks/followup_ledger.py
            packages/claude-dev-env/hooks/hooks_constants/__init__.py
            packages/claude-dev-env/hooks/hooks_constants/followup_ledger_constants.py
            packages/claude-dev-env/hooks/hooks_constants/subprocess_window.py
            packages/claude-dev-env/hooks/hooks_constants/subprocess_window_constants.py
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Validate exact instruction imports
        if: ${{ !inputs.skip-validation }}
        run: python .instruction-pair-validator/packages/claude-dev-env/scripts/validate_instruction_pairs.py --repository-root .
