name: Validate instruction pairs

on:
  pull_request:
  pull_request_target:
  push:
    branches:
      - main
    paths:
      - "**/CLAUDE.md"
      - "**/AGENTS.md"
      - "**/*.md"
      - ".github/workflows/instruction-pairs-reusable.yml"
      - ".github/workflows/validate-instruction-pairs.yml"
      - "packages/claude-dev-env/scripts/validate_instruction_pairs.py"
      - ".pre-commit-config.yaml"
      - ".gitattributes"
  merge_group:
  workflow_dispatch:

jobs:
  instruction-pairs:
    uses: ./.github/workflows/instruction-pairs-reusable.yml
    with:
      # Validator script: github.sha (base commit on pull_request_target; pushed
      # commit on push). Tree under validation: pull request head when present.
      validator-ref: ${{ github.sha }}
      checkout-ref: ${{ github.event.pull_request.head.sha || github.sha }}
      # Release-please detection (any one): branch prefix release-please--,
      # title chore(.*): release , label autorelease: pending.
      skip-validation: >-
        ${{ startsWith(github.head_ref, 'release-please--')
        || startsWith(github.event.pull_request.title, 'chore: release ')
        || (startsWith(github.event.pull_request.title, 'chore(')
        && contains(github.event.pull_request.title, '): release '))
        || contains(github.event.pull_request.labels.*.name, 'autorelease: pending') }}
    permissions:
      contents: read
