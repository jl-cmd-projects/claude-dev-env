# Trigger scope: no branches filter on pull_request, so a PR based on a stacked
# parent branch gets its title validated the same way a PR based on main does.
name: PR checks

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened
      - ready_for_review

concurrency:
  group: pr-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate PR title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@e32d7e603df1aa1ba07e981f2a23455dee596825 # v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          requireScope: false
          subjectPattern: ^.+$
          subjectPatternError: "PR title must not be empty"
          types: |
            feat
            fix
            chore
            docs
            style
            refactor
            perf
            test
            build
            ci
            revert

  fix-test-proof:
    name: Fix test proof
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python test dependencies
        run: |
          pip install -e packages/claude-dev-env/ \
            -r packages/claude-dev-env/scripts/pr_verification/requirements.txt \
            pytest \
            pyyaml \
            Pillow \
            ruff

      - name: Configure git identity for test repos
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"

      - name: Require a fix to carry a test that fails on the base
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PYTHONPATH: packages/claude-dev-env/_shared/pr-loop/scripts
        run: |
          python packages/claude-dev-env/_shared/pr-loop/scripts/fix_pr_test_proof.py \
            --title "$PR_TITLE" \
            --base "$BASE_SHA" \
            --repository-root .
