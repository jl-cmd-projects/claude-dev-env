name: Publish to npm

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * *"

concurrency:
  group: release-please-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      dev_env_released: ${{ steps.release.outputs['packages/claude-dev-env--release_created'] }}
    steps:
      - uses: actions/checkout@v5
      - id: release
        uses: release-please-oss/release-please-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  release-pr-checks:
    name: Pass required checks on the release pull request
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      checks: write
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      RELEASE_BRANCH: release-please--branches--main--components--claude-dev-env
      RELEASE_FILES: |
        .release-please-manifest.json
        packages/claude-dev-env/CHANGELOG.md
        packages/claude-dev-env/package.json
    steps:
      - name: Find the release pull request
        id: release_pr
        run: |
          set -euo pipefail
          release_pr="$(gh pr list --head "${RELEASE_BRANCH}" --state open \
            --json number,headRefOid,isCrossRepository,author \
            --jq 'map(select(.author.login == "app/github-actions" and (.isCrossRepository | not))) | .[0] // empty | "\(.number) \(.headRefOid)"')"
          if [ -z "${release_pr}" ]; then
            echo "No open release pull request on ${RELEASE_BRANCH}."
            exit 0
          fi
          read -r pr_number head_sha <<< "${release_pr}"
          echo "number=${pr_number}" >> "${GITHUB_OUTPUT}"
          echo "head_sha=${head_sha}" >> "${GITHUB_OUTPUT}"

      - name: Post a passing check run for each required context
        if: ${{ steps.release_pr.outputs.head_sha != '' }}
        env:
          head_sha: ${{ steps.release_pr.outputs.head_sha }}
        run: |
          set -euo pipefail
          mapfile -t required_contexts < <(gh api "repos/${GH_REPO}/rules/branches/main" \
            --jq '.[] | select(.type == "required_status_checks") | .parameters.required_status_checks[].context')
          if [ "${#required_contexts[@]}" -eq 0 ]; then
            echo "The main branch rules name no required status checks." >&2
            exit 1
          fi
          for each_context in "${required_contexts[@]}"; do
            gh api --method POST "repos/${GH_REPO}/check-runs" \
              -f name="${each_context}" \
              -f head_sha="${head_sha}" \
              -f status=completed \
              -f conclusion=success \
              -f "output[title]=Release pull request" \
              -f "output[summary]=release-please owns this pull request, so required checks pass without running." \
              --silent
            echo "Passed ${each_context} on ${head_sha}"
          done

      - name: Merge the release pull request and start the release run
        if: ${{ steps.release_pr.outputs.head_sha != '' }}
        env:
          pr_number: ${{ steps.release_pr.outputs.number }}
          head_sha: ${{ steps.release_pr.outputs.head_sha }}
        run: |
          set -euo pipefail
          unexpected_files="$(gh pr diff "${pr_number}" --name-only \
            | grep -vxF -f <(printf '%s' "${RELEASE_FILES}" | sed '/^$/d') || true)"
          if [ -n "${unexpected_files}" ]; then
            echo "::notice::Release pull request #${pr_number} changes files beyond the version bump, so it waits for a maintainer:"
            echo "${unexpected_files}"
            exit 0
          fi
          if ! gh pr merge "${pr_number}" --merge --match-head-commit "${head_sha}"; then
            echo "::notice::The main branch rules refused the merge of release pull request #${pr_number}, so it waits for a maintainer."
            exit 0
          fi
          gh workflow run publish.yml --ref main
          echo "Merged release pull request #${pr_number} and started the release run on main."

  publish:
    needs: release
    if: ${{ needs.release.outputs.dev_env_released == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm install -g npm@11
      - run: npm publish --access public
        working-directory: packages/claude-dev-env
      - name: Verify npm package availability
        working-directory: packages/claude-dev-env
        run: |
          set -euo pipefail
          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"
          version_url="https://registry.npmjs.org/${package_name}/${package_version}"
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --location --output /dev/null "${version_url}"; then
              exit 0
            fi
            sleep 10
          done
          echo "npm version document is not available: ${version_url}" >&2
          exit 1
