name: Private terms

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened
  issues:
    types:
      - opened
      - edited
  issue_comment:
    types:
      - created
      - edited
  pull_request_review:
    types:
      - submitted
      - edited
  pull_request_review_comment:
    types:
      - created
      - edited
  release:
    types:
      - published
      - edited
  merge_group:

permissions:
  contents: read

concurrency:
  group: private-terms-${{ github.event_name }}-${{ github.event.comment.id || github.event.review.id || github.event.pull_request.number || github.event.issue.number || github.event.release.id || github.event.merge_group.head_sha }}
  cancel-in-progress: true

jobs:
  scan:
    name: Private terms
    if: github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Scan the event text and the pull request's commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          commit_range_arguments=()
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            commit_range_arguments=(--commit-range "${BASE_SHA}..${HEAD_SHA}")
          fi
          python3 packages/claude-dev-env/scripts/private_term_scan.py --event-path "${GITHUB_EVENT_PATH}" "${commit_range_arguments[@]}"
